<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
@font-face{font-family:"Cubic11";src:url(fonts/Cubic_11.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Galmuri11";src:url(fonts/Galmuri11.woff2) format("woff2");font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7AF,U+D7B0-D7FF}
:root{--bg:#EEF1F4;--panel:#fff;--ink:#16202C;--mute:#5E6B7A;--chip:#DFE5EC;--line:#CBD3DC;--acc:#2F4BFF;--on:#fff;--mark:#FFB400;--bad:#C2255C;--stage:#DDE3EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151C;--panel:#18202A;--ink:#E8EDF2;--mute:#97A3B0;--chip:#232D3A;--line:#2B3644;--acc:#8C9BFF;--on:#0B1020;--mark:#FFC53D;--bad:#FF7AA8;--stage:#8E9AA8}}
:root[data-theme="dark"]{--bg:#10151C;--panel:#18202A;--ink:#E8EDF2;--mute:#97A3B0;--chip:#232D3A;--line:#2B3644;--acc:#8C9BFF;--on:#0B1020;--mark:#FFC53D;--bad:#FF7AA8;--stage:#8E9AA8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Cubic11","Galmuri11","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:33px;line-height:1.2;margin:4px 0 10px;font-weight:400}
b,strong{font-weight:400}
.sub{color:var(--mute);font-size:14px;margin:4px 0 10px}
.tabs,.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
button,select,input{font:inherit;color:var(--ink);background:var(--chip);border:0;border-radius:0;padding:8px 12px;min-height:40px;cursor:pointer}
input{cursor:text}
select{padding-right:8px}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--on)}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);padding:12px;margin:10px 0}
.card p{margin:6px 0}
#msg{min-height:22px;color:var(--bad);font-size:14px}
#msg:empty{display:none}
.chip{padding:2px 10px;background:var(--chip);font-size:13px}

/* top bar */
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.top .tabs{margin:0}
#lang,#lang option{min-height:40px;font-family:"Cubic11",system-ui,sans-serif}

/* 8號 */
.who{display:flex;gap:14px;align-items:center;margin:16px 0}
.who canvas{width:48px;height:72px;image-rendering:pixelated;flex:none;background:var(--stage);cursor:zoom-in;padding:0}
.who p{margin:0;font-size:16px}
#avm{position:fixed;inset:0;z-index:20;background:rgba(8,12,18,.72);display:grid;place-items:center;cursor:zoom-out}
#avm figure{margin:0;display:grid;gap:10px;justify-items:center;color:#fff;font-size:18px}
#avm canvas{width:min(70vw,260px);aspect-ratio:20/26;image-rendering:pixelated;background:var(--stage)}

/* hero：左說明・中畫布・右調色盤 */
.hero{display:grid;gap:14px 16px;margin:6px 0 22px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"txt txt" "cv side" "cap cap" "cta cta"}
.htxt{grid-area:txt}
.mcv{grid-area:cv;position:relative;align-self:start}
.mcv canvas{display:block;width:100%;aspect-ratio:54/64;image-rendering:pixelated;background:var(--panel)}
.mside{grid-area:side;align-self:start}
.mcap{grid-area:cap;margin:0;font-size:14px;color:var(--mute)}
.cta{grid-area:cta;display:flex;flex-wrap:wrap;gap:8px}
.cta button{min-width:120px}
.nt0{margin:0 0 16px}
.nt0 b{display:block;font-size:20px;line-height:1.45}
.nt0 p{margin:4px 0 0;color:var(--mute)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px;color:var(--mute)}
.steps li::before{counter-increment:s;content:counter(s);color:var(--acc);font-size:22px;line-height:1.1;text-align:center}
.steps b{display:block;font-size:17px;color:var(--ink)}
.mpal{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mpal button{aspect-ratio:1;min-height:0;padding:0}
.mtl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.mtl span{font-size:13px;line-height:1.4;padding:4px 8px;background:var(--panel);border-radius:14px;word-break:keep-all;text-align:center;cursor:help}
.six{position:absolute;top:0;bottom:0;left:0;width:11.111%;pointer-events:none;opacity:0;background:linear-gradient(to right,rgba(255,255,255,.85) 1px,transparent 1px) 0 0/calc(100%/6) 100%,rgba(255,255,255,.18);box-shadow:1px 0 0 rgba(255,255,255,.85)}
.six.on{opacity:1}
#tip{position:fixed;z-index:30;max-width:260px;padding:8px 10px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.5;pointer-events:none}
#tip i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
@media(min-width:900px){
 .hero{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,.78fr);grid-template-areas:"txt cv side" "cta cap cap";gap:16px 28px}
 .htxt{align-self:start}
}

/* 長卷 */
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}
.shead b{font-size:22px}
.shead span{color:var(--mute)}
.scroll{overflow-x:auto}
.strip{width:1152px}
.inner{position:relative;width:100%;height:192px;background:var(--panel)}
.inner canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.seg{position:absolute;top:0;bottom:0;width:12.5%;border:0;background:transparent;min-height:0;padding:4px 6px;text-align:left;vertical-align:top;font-size:13px;text-shadow:0 0 3px var(--panel),0 0 3px var(--panel)}
.seg.empty{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--chip) 8px 10px)}
.seg.sel{background:transparent;box-shadow:inset 0 0 0 2px var(--acc)}
.seg.empty.sel{background:transparent;box-shadow:inset 0 0 0 2px var(--acc)}
.marks{position:relative;height:30px}
.mk{position:absolute;top:4px;width:12.5%;text-align:center;font-size:15px;color:var(--acc)}
.mk.ai{color:var(--bad)}
.hist h2{font-size:20px;font-weight:400;margin:28px 0 8px}
.scr{display:flex;flex-wrap:wrap;gap:6px}
.scr button{font-size:15px}
.scr small{color:var(--mute);margin-left:6px}
.scr button.on small{color:inherit;opacity:.8}

@media(min-width:641px){.strip{width:100%}.inner{height:auto;aspect-ratio:6}}

/* draw */
.cvw{position:relative;touch-action:none}
#cv{display:block;width:100%;aspect-ratio:54/64;image-rendering:pixelated;touch-action:none;background:var(--panel)}
.sepl{position:absolute;top:0;bottom:0;left:11.111%;border-left:2px dashed var(--mark);pointer-events:none}
.vp{overflow:auto;max-height:68vh;background:var(--panel)}
.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(127,127,127,.4) 1px,transparent 1px),linear-gradient(to bottom,rgba(127,127,127,.4) 1px,transparent 1px);background-size:calc(100%/54) 100%,100% calc(100%/64)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.sw{aspect-ratio:1;min-height:32px;padding:0}
.sw.on{outline:3px solid var(--acc);outline-offset:1px}
.tm{font-variant-numeric:tabular-nums;font-size:20px}
.tm.low{color:var(--bad)}
#oPrev{width:192px;height:256px;image-rendering:pixelated}
button{touch-action:manipulation}
#dBody{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kbd,.tch{display:none}
.hov{position:absolute;pointer-events:none;outline:1px solid #fff;box-shadow:0 0 0 2px #000}
@media(hover:hover) and (pointer:fine){.kbd{display:inline}}
@media(pointer:coarse){.tch{display:inline}button{min-height:44px}.sw{min-height:40px}}
@media(max-width:640px){
main:has(#dBody:not([hidden]))>h1{display:none}
.dock{position:sticky;bottom:0;margin:0 -16px;padding:8px 16px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.dock .pal{display:flex;overflow-x:auto;margin:0 0 6px}
.dock .sw{flex:0 0 40px}
#tools,#opts{flex-wrap:nowrap;overflow-x:auto;margin:6px 0}
#tools button,#opts button{flex:0 0 auto}
#send{width:100%}
.vp{max-height:calc(100vh - 380px);max-height:calc(100dvh - 380px)}
}
@media(min-width:641px){
main{max-width:900px}
#dBody{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
#dBody>.sub{grid-column:1/-1;margin:0}
#dBody .vp{grid-column:1;max-height:calc(100vh - 210px);max-height:calc(100dvh - 210px)}
.dock{grid-column:2;grid-row:2;position:sticky;top:12px}
.pal{grid-template-columns:repeat(4,1fr)}
.sw{aspect-ratio:auto;height:44px}
#tools,#opts{display:grid;grid-template-columns:1fr 1fr}
#st{grid-column:1/-1}
#send{width:100%}
}
@media(min-width:1100px){
main{max-width:1180px}
#dBody{grid-template-columns:minmax(0,1fr) 320px}
#dBody .vp{max-height:calc(100vh - 190px)}
}
@media(min-width:1100px) and (pointer:fine){.pal{grid-template-columns:repeat(8,1fr)}.sw{height:32px;min-height:0}}
.trow{display:contents}
.cc,.hb{display:none}
textarea{font:inherit;color:var(--ink);background:var(--chip);border:0;padding:8px;width:100%;min-height:64px;resize:vertical}
.nt{padding:6px 0;margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.nt+.nt{box-shadow:0 -1px 0 var(--chip)}
@media(max-width:640px){
.dr{display:flex;flex-direction:column;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:0}
.dr>.top{display:none}
.dr>#msg{position:fixed;left:8px;right:8px;top:52px;z-index:5;margin:0;padding:4px 10px;background:var(--panel)}
.dr #vD{display:flex;flex-direction:column;flex:1;min-height:0}
.dr #dHead{display:flex;align-items:center;gap:6px;margin:0;padding:4px 8px}
.dr #dHead .tm{margin-right:auto;font-size:18px}
.dr .hb{display:block;min-height:36px;padding:2px 8px;font-size:14px}
.dr .hb:first-of-type{color:var(--acc)}
.dr #dBody{display:flex;flex-direction:column;flex:1;min-height:0}
.dr #dBody>.sub{display:none}
.dr #dBody .vp{flex:1;min-height:0;max-height:none;display:flex}
.dr .cvw{flex:none;margin:auto}
.dr .dock{position:relative;margin:0;padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.dr #send{display:none}
.dr #opts button.history-action{background:#d5d9de;color:#27313a;border-color:#aeb5bd}
.dr .trow{display:flex;gap:6px;overflow-x:auto}
.dr #tools,.dr #opts{display:flex;flex:none;flex-wrap:nowrap;margin:0;overflow:visible}
.dr .cc{display:block;flex:0 0 44px;min-height:40px}
.dr #tools button,.dr #opts button{min-height:40px}
.dr .pal{display:none}
.dr.pp .pal{display:grid;position:absolute;left:8px;right:8px;bottom:100%;grid-template-columns:repeat(8,1fr);padding:8px;margin:0 0 6px;background:var(--panel);z-index:6}
.dr.pp .pal .sw{flex:none;height:40px}
}
.sw,.mpal button{box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}

/* 文字按鈕：沒有框，滑鼠移過去字放大、變藍 */
.top button,.top select,.cta button{background:none;padding:6px 4px;min-width:0;color:var(--ink);transition:transform .12s,color .12s;transform-origin:left center}
.top .tabs,.cta{gap:18px}
.top button.on,#tG{color:var(--acc)}
.top select{padding-right:2px}
@media(hover:hover){.top button:hover,.top select:hover,.cta button:hover{color:var(--acc);transform:scale(1.15)}}
.top button:active,.top select:active,.cta button:active{color:var(--acc);transform:scale(1.15)}
.cta button{font-size:20px}
#goB{color:var(--acc)}
